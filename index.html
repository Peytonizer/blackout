<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      This CSP is the privacy guarantee made mechanical: `connect-src 'none'` means the browser
      itself refuses any network request the page's JavaScript might try to make, so "nothing
      leaves the page" is something a sceptical user can verify by reading this tag rather than
      trusting a comment. Never relax this to make a feature work — find another way, or stop
      and flag it. See SPEC.md's decisions table for the full reasoning.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none';"
    />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Redact screenshots and PDFs by destroying the marked pixels and rebuilding the file, entirely in your browser. Nothing here leaves the page."
    />
    <title>Blackout</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
